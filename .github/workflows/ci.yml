name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: incidents_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/incidents_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80 --timeout=120

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The free-hosting setup: one process serving the site and API, with no Redis or Celery,
  # driven by a real browser, including an accessibility scan.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: incidents_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/incidents_e2e
      JWT_SECRET: e2e-only-secret-that-signs-nothing-real
      DEMO_PASSWORD: e2e-only-demo-password
      ADMIN_SIGNUP_CODE: e2e-only-admin-access-code
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      SINGLE_PROCESS: "true"
      STATIC_DIR: ${{ github.workspace }}/frontend/dist
      RATE_LIMIT_LOGIN: 200/minute
      RATE_LIMIT_REGISTER: 200/minute
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Train, migrate and load demo data
        working-directory: backend
        run: |
          python -m app.ml.train
          python -m alembic upgrade head
          python -m scripts.seed_demo --incidents 150
      - name: Start the app
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8010 > "$RUNNER_TEMP/server.log" 2>&1 &
          for attempt in $(seq 1 60); do curl -fs http://127.0.0.1:8010/ready && break; sleep 2; done
          curl -fs http://127.0.0.1:8010/ready || { cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Time one assistant answer through the API
        run: |
          token=$(curl -fs -X POST http://127.0.0.1:8010/api/v1/auth/demo | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
          result=$(curl -s -o /tmp/chat.json -w '%{http_code} in %{time_total}s' -m 120 -X POST -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" -d '{"message": "how long do we have to fix a P2 ticket"}' http://127.0.0.1:8010/api/v1/ai/chat)
          echo "::notice title=assistant through the API::$result $(head -c 250 /tmp/chat.json)"
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8010
          E2E_DEMO_PASSWORD: e2e-only-demo-password
          E2E_ADMIN_CODE: e2e-only-admin-access-code
      # Annotations are public, unlike logs and artifacts, so the evidence is readable by anyone.
      - name: Report server errors
        if: failure()
        run: |
          grep -E '"level": "(ERROR|WARNING)"|Traceback|"status": (429|5[0-9][0-9])' "$RUNNER_TEMP/server.log" | tail -n 8 | while IFS= read -r line; do
            echo "::warning title=server log::${line:0:400}"
          done
          grep -E 'ai/chat|Traceback|Error' "$RUNNER_TEMP/server.log" | tail -n 8 | while IFS= read -r line; do
            echo "::notice title=chat in server log::${line:0:400}"
          done
          cp "$RUNNER_TEMP/server.log" e2e/playwright-report/ 2>/dev/null || true
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: e2e/playwright-report
          retention-days: 7

  # The full deployment: PostgreSQL, Redis, the bootstrap job, API, worker, scheduler and nginx.
  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=compose-ci-password/" .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^DEMO_PASSWORD=.*/DEMO_PASSWORD=compose-ci-demo-password/" .env
      - run: docker compose up -d --build
      - name: Wait for sign-in to work through nginx
        run: |
          for attempt in $(seq 1 120); do
            if curl -fs -o /tmp/token.json -d "username=manager@example.com&password=compose-ci-demo-password" http://localhost:8080/api/v1/auth/login; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Check the running stack
        run: |
          token=$(python3 -c "import json; print(json.load(open('/tmp/token.json'))['access_token'])")
          total=$(curl -fs -H "Authorization: Bearer $token" "http://localhost:8080/api/v1/incidents?page_size=1" | python3 -c "import json,sys; print(json.load(sys.stdin)['total'])")
          echo "incidents: $total"; test "$total" -gt 0
          curl -fs -D - -o /dev/null http://localhost:8080/ | grep -i "cache-control: no-cache"
          asset=$(curl -fs http://localhost:8080/ | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1)
          curl -fs -D - -o /dev/null "http://localhost:8080/$asset" | grep -i "immutable"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/removed-by-a-deploy.js)" = "404"
          docker compose ps --format '{{.Service}} {{.State}}' | tee /tmp/state.txt
          grep -q "worker running" /tmp/state.txt && grep -q "beat running" /tmp/state.txt
      - if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v
