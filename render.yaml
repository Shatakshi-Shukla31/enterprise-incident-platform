services:
  - type: web
    name: incident-platform
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DB_DISABLE_PREPARED_STATEMENTS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SIGNUP_CODE
        generateValue: true
      - key: DATABASE_URL
        sync: false
