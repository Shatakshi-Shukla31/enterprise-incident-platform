[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "S101", "S311", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
"tests/*" = ["E501", "S"]
"app/ml/synthetic.py" = ["E501"]
"app/services/remediation.py" = ["E501"]
"app/rag/generator.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:slowapi", "ignore::DeprecationWarning:limits"]
